<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사진 공식 선택기</title>
    <style>
      :root {
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        color: #e8e6e1;
        background: #14120f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100vh; padding: 24px 16px 60px; }
      .wrap { max-width: 920px; margin: 0 auto; }

      h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      .sub { color: #a39a8c; font-size: 13px; margin: 6px 0 8px; }

      h2 { font-size: 13px; font-weight: 700; color: #c9bfae; margin: 26px 0 10px; letter-spacing: 0.04em; text-transform: uppercase; }
      h2 .h2desc { text-transform: none; letter-spacing: 0; color: #8a7f6d; font-weight: 400; margin-left: 8px; }

      /* 버튼 공통 */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
      .grid.small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .fbtn {
        text-align: left; cursor: pointer; border: 1px solid #2b2823; border-radius: 12px;
        background: #1c1917; padding: 12px 14px; color: #e8e6e1;
        transition: all .15s ease; font-family: inherit;
      }
      .fbtn:hover { border-color: #6b5f4d; transform: translateY(-1px); }
      .fbtn.active { border-color: #e0a75e; background: #2a2117; box-shadow: 0 0 0 1px #e0a75e inset; }
      .fbtn .name { font-size: 14px; font-weight: 700; display: block; }
      .fbtn .feel { font-size: 12px; color: #a39a8c; margin-top: 3px; display: block; }

      /* 설명 박스 */
      .infobox {
        background: #221d17; border: 1px solid #3a3129; border-left: 3px solid #e0a75e;
        border-radius: 10px; padding: 12px 16px; font-size: 13px; line-height: 1.7;
        color: #d6cfc2; margin-top: 12px; display: none;
      }
      .infobox.show { display: block; }
      .infobox b { color: #e0a75e; }

      /* 수동 조절 */
      .panel { background: #1c1917; border: 1px solid #2b2823; border-radius: 14px; padding: 18px; }
      .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
      @media (max-width: 620px) { .rows { grid-template-columns: 1fr; } }
      .row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
      .row label { flex: 0 0 96px; font-size: 13px; color: #c9bfae; }
      .row input[type="range"] { flex: 1; accent-color: #e0a75e; height: 4px; }
      .row .val { flex: 0 0 30px; text-align: right; font-size: 12px; color: #e0a75e; font-variant-numeric: tabular-nums; }
      .reset { margin-top: 10px; background: none; border: none; color: #8a7f6d; font-size: 12px; cursor: pointer; text-decoration: underline; font-family: inherit; }
      .reset:hover { color: #e0a75e; }

      /* 미리보기 + 복사 */
      .preview-box { margin-top: 26px; }
      .prompt-box {
        background: #100e0c; border: 1px solid #2b2823; border-radius: 14px;
        padding: 16px; font-size: 13px; line-height: 1.7; color: #d6cfc2;
        min-height: 110px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        white-space: pre-wrap; word-break: keep-all;
      }
      .actions { display: flex; gap: 10px; margin-top: 12px; }
      .copy {
        flex: 1; background: #e0a75e; color: #14120f; font-weight: 800; font-size: 14px;
        border: none; border-radius: 10px; padding: 13px; cursor: pointer; font-family: inherit;
        transition: background .15s;
      }
      .copy:hover { background: #ecb877; }
      .copy.ok { background: #7fb069; }
      .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #7fb069; color: #14120f; padding: 9px 20px; border-radius: 999px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; }
      .toast.show { opacity: 1; }
      .hint { color: #6f6759; font-size: 12px; margin-top: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>📷 사진 공식 선택기</h1>
      <p class="sub">① 느낌 프리셋을 고르거나 ② 바디·렌즈·필름을 직접 골라 조합하고, ③ 슬라이더로 다듬고, ④ 복사해서 보정 프롬프트로 쓰세요.</p>

      <h2>1 · 느낌 프리셋</h2>
      <div class="grid" id="presets"></div>
      <div class="infobox" id="presetInfo"></div>

      <h2>2 · 카메라 바디 <span class="h2desc">색감·선명도 성향 결정</span></h2>
      <div class="grid small" id="bodies"></div>
      <div class="infobox" id="bodyInfo"></div>

      <h2>3 · 렌즈 <span class="h2desc">구도·심도 느낌 결정</span></h2>
      <div class="grid small" id="lenses"></div>
      <div class="infobox" id="lensInfo"></div>

      <h2>4 · 필름 / 톤 <span class="h2desc">여기서 완전한 필름 감성 가능 (생략 가능)</span></h2>
      <div class="grid small" id="films"></div>
      <div class="infobox" id="filmInfo"></div>

      <h2>5 · 수동 조절</h2>
      <div class="panel">
        <div class="rows" id="controls"></div>
        <button class="reset" id="reset">↺ 현재 선택 기본값으로 초기화</button>
      </div>

      <div class="preview-box">
        <h2>6 · 결과 프롬프트</h2>
        <div class="prompt-box" id="prompt"></div>
        <div class="actions">
          <button class="copy" id="copy">📋 프롬프트 복사</button>
        </div>
        <p class="hint">이 텍스트를 이미지 편집 AI에 붙여넣으면 선택한 공식으로 보정됩니다.</p>
      </div>
    </div>
    <div class="toast" id="toast">복사 완료!</div>

    <script>
      /* ── 데이터 ── */
      const BODIES = [
        { id: "canon", name: "Canon EOS R5 Mark II", desc: "Canon 컬러 사이언스: 따뜻하고 자연스러운 피부톤·음식 색 표현이 장점. 고해상도 센서로 디테일도 충실. 일상·음식·인물에 무난한 만능 바디." },
        { id: "sony", name: "Sony A7 IV / A1", desc: "차갑고 깔끔한 화이트밸런스와 강력한 AF. 또렷한 해상력으로 도시·공간·스포츠 같은 선명한 사진에 유리. 기록·다큐 성향." },
        { id: "fuji", name: "Fujifilm X-T5", desc: "필름 시뮬레이션(Classic Chrome, Velvia 등) 내장. 디지털인데 필름 같은 은은한 색과 그레인이 나옴. 감성 스냅·여행의 정답." },
        { id: "nikon", name: "Nikon Z8", desc: "부드러운 톤 그라데이션과 촉촉한 하이라이트. 인물 피부를 겹겹이 표현해 화보·웨딩에 강함." },
        { id: "leica", name: "Leica Q3", desc: "미묘한 채도와 깊은 색감, 특히 흑백 모노크롬의 깊이가 독보적. 스트리트·다큐먼트의 '고급스러운 담백함'." },
        { id: "none", name: "선택 안 함", desc: "바디 성향 없이 렌즈·필름·수동 조절만으로 프롬프트를 만듭니다." }
      ];

      const LENSES = [
        { id: "24", name: "24mm 광각", desc: "공간 전체를 넓게 담는 시야. 카페 인테리어, 건물, 풍경처럼 '공간감'을 보여줄 때. 왜곡은 살짝 있지만 몰입감이 큼." },
        { id: "35", name: "35mm 담백", desc: "인간의 시야와 가까운 자연스러운 화각. 거리 스냅, 일상 기록의 표준. 담백하면서 스토리가 담김." },
        { id: "50", name: "50mm 표준", desc: "눈으로 보는 것과 거의 같은 원근감. 가장 '인간적'인 화각으로 음식·인물·일상 모두 무난. F1.8이면 배경 흐림도 자연스러움." },
        { id: "85", name: "85mm 인물", desc: "압축된 원근감과 극도로 얕은 심도. 배경을 크림처럼 녹여 인물을 돋보이게 함. 화보·프로필 전용 느낌." },
        { id: "100m", name: "100mm 매크로", desc: "접착 촬영으로 제품·음료·디테일을 극한까지 선명하게. 광고·제품 사진용." },
        { id: "135", name: "135mm 압축", desc: "멀리서 재빨리 담는 압축 화각. 운동·아이·반려동물 같은 움직이는 순간을 배경과 분리해서 캐치." }
      ];

      const FILMS = [
        { id: "portra400", name: "Kodak Portra 400", desc: "크림 같은 피부톤과 부드러운 파스텔 색감. 인물·웨딩 필름의 대명사. 채도는 낮지만 색이 '고급스럽게' 보임." },
        { id: "gold200", name: "Kodak Gold 200", desc: "복고 노란빛 웜톤. 90년대 유행했던 향수 감성. 빈티지 사진 찍을 때 바로 떠오르는 색." },
        { id: "cinestill", name: "CineStill 800T", desc: "텅스텐 웜톤과 특유의 '할레이션'(밝은 빛이 번지는 현상). 야경·네온 사진의 감성 끝판왕." },
        { id: "fuji400h", name: "Fuji 400H", desc: "청록빛이 도는 청량한 톤. 하늘·바다·여름 풍경이 시원하게 표현됨." },
        { id: "bw", name: "흑백 모노크롬", desc: "색을 걷어내고 명암만 남김. 형태·질감·감정이 부각되는 다큐먼트·아트 느낌." },
        { id: "none", name: "선택 안 함", desc: "필름 시뮬레이션 없이 바디 기본 컬러 사이언스만 사용합니다." }
      ];

      const PRESETS = [
        { name: "Canon R5 MkII + RF 50mm F1.8", feel: "따뜻한 일상 감성", body: "canon", lens: "50", film: "none",
          v: { warmth: 55, contrast: 45, saturation: 50, bokeh: 60, grain: 5, vignette: 15, sharpness: 60 } },
        { name: "Sony A7 IV + FE 24mm F1.4 GM", feel: "깨끗한 공간 감성", body: "sony", lens: "24", film: "none",
          v: { warmth: 25, contrast: 55, saturation: 45, bokeh: 20, grain: 0, vignette: 5, sharpness: 75 } },
        { name: "Sony A7 IV + FE 35mm F1.4 GM", feel: "선명한 시티 라이프", body: "sony", lens: "35", film: "none",
          v: { warmth: 30, contrast: 60, saturation: 50, bokeh: 40, grain: 3, vignette: 10, sharpness: 80 } },
        { name: "Fujifilm X-T5 + XF 35mm F1.4", feel: "필름 감성 클래식", body: "fuji", lens: "35", film: "none",
          v: { warmth: 50, contrast: 40, saturation: 38, bokeh: 45, grain: 35, vignette: 20, sharpness: 45 } },
        { name: "Nikon Z8 + 85mm f/1.2", feel: "촉촉한 인물 화보", body: "nikon", lens: "85", film: "none",
          v: { warmth: 45, contrast: 38, saturation: 42, bokeh: 90, grain: 5, vignette: 12, sharpness: 55 } },
        { name: "CineStill 800T", feel: "야경·네온 감성", body: "sony", lens: "35", film: "cinestill",
          v: { warmth: 65, contrast: 55, saturation: 65, bokeh: 55, grain: 30, vignette: 30, sharpness: 45 } },
        { name: "Leica Q3 · 28mm B&W", feel: "고급스러운 다큐먼트", body: "leica", lens: "35", film: "bw",
          v: { warmth: 50, contrast: 70, saturation: 0, bokeh: 50, grain: 15, vignette: 25, sharpness: 70 } },
        { name: "Fuji 400H", feel: "청량한 여름 풍경", body: "fuji", lens: "35", film: "fuji400h",
          v: { warmth: 30, contrast: 35, saturation: 48, bokeh: 25, grain: 25, vignette: 10, sharpness: 50 } },
        { name: "Kodak Gold 200", feel: "레트로 빈티지", body: "canon", lens: "50", film: "gold200",
          v: { warmth: 70, contrast: 45, saturation: 55, bokeh: 30, grain: 30, vignette: 20, sharpness: 40 } },
        { name: "Kodak Portra 400", feel: "크림 같은 인물톤", body: "nikon", lens: "85", film: "portra400",
          v: { warmth: 55, contrast: 30, saturation: 40, bokeh: 55, grain: 18, vignette: 10, sharpness: 45 } },
        { name: "Canon R5 MkII + RF 100mm Macro", feel: "제품 광고풍", body: "canon", lens: "100m", film: "none",
          v: { warmth: 40, contrast: 55, saturation: 52, bokeh: 65, grain: 0, vignette: 8, sharpness: 92 } },
        { name: "Sony A1 + FE 135mm f/1.8", feel: "역동적인 순간 캐치", body: "sony", lens: "135", film: "none",
          v: { warmth: 35, contrast: 58, saturation: 55, bokeh: 75, grain: 2, vignette: 12, sharpness: 85 } }
      ];

      const CONTROLS = [
        { key: "warmth", label: "따뜻함", desc: "낮음=차가운 쿨톤 / 높음=따뜻한 웜톤" },
        { key: "contrast", label: "대비", desc: "낮음=부드러운 / 높음=크리스피한 명암" },
        { key: "saturation", label: "채도", desc: "낮음=뉴트럴 / 높음=생생한 색" },
        { key: "bokeh", label: "보케(배경흐림)", desc: "낮음=전체 선명 / 높음=얕은 심도" },
        { key: "grain", label: "필름 그레인", desc: "높일수록 필름 질감이 올라옴" },
        { key: "vignette", label: "비네트", desc: "가장자리를 어둡게 해 분위기 부여" },
        { key: "sharpness", label: "선명도", desc: "높음=고해상도 디테일 강조" }
      ];

      /* ── 상태 ── */
      let sel = { body: "canon", lens: "50", film: "none" };
      let values = { ...PRESETS[0].v };

      /* ── 렌더링 헬퍼 ── */
      function makeBtn(container, item, group, infoEl, onPick) {
        const b = document.createElement("button");
        b.className = "fbtn";
        b.innerHTML = '<span class="name">' + item.name + '</span><span class="feel">' + (item.feel || (item.desc ? item.desc.split(".")[0] + "." : "")) + '</span>';
        b.onclick = () => {
          if (onPick) onPick(item);
          container.querySelectorAll(".fbtn").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          if (infoEl) {
            infoEl.innerHTML = "<b>" + item.name + "</b> — " + (item.desc || item.feel);
            infoEl.classList.add("show");
          }
          render();
        };
        container.appendChild(b);
        return b;
      }

      const presetsEl = document.getElementById("presets");
      const bodiesEl = document.getElementById("bodies");
      const lensesEl = document.getElementById("lenses");
      const filmsEl = document.getElementById("films");
      const controlsEl = document.getElementById("controls");
      const promptEl = document.getElementById("prompt");

      PRESETS.forEach((p, i) => {
        const b = makeBtn(presetsEl, { name: p.name, feel: p.feel, desc: "'" + p.name + "' 프리셋: " + p.feel + " 느낌의 사진. 클릭하면 아래 바디·렌즈·필름·슬라이더가 이 조합에 맞게 자동 설정됩니다." }, null, document.getElementById("presetInfo"),
          item => { sel = { body: p.body, lens: p.lens, film: p.film }; values = { ...p.v }; markActive(); });
        if (i === 0) b.classList.add("active");
      });

      BODIES.forEach(item => makeBtn(bodiesEl, item, null, document.getElementById("bodyInfo"), item => { sel.body = item.id; }));
      LENSES.forEach(item => makeBtn(lensesEl, item, null, document.getElementById("lensInfo"), item => { sel.lens = item.id; }));
      FILMS.forEach(item => makeBtn(filmsEl, item, null, document.getElementById("filmInfo"), item => { sel.film = item.id; }));

      function markActive() {
        const groups = [
          [bodiesEl, BODIES, sel.body],
          [lensesEl, LENSES, sel.lens],
          [filmsEl, FILMS, sel.film]
        ];
        groups.forEach(([el, arr, id]) => {
          const idx = arr.findIndex(x => x.id === id);
          el.querySelectorAll(".fbtn").forEach((x, i) => x.classList.toggle("active", i === idx));
        });
      }
      markActive();

      /* ── 슬라이더 ── */
      CONTROLS.forEach(c => {
        const row = document.createElement("div");
        row.className = "row";
        row.title = c.desc;
        row.innerHTML =
          '<label title="' + c.desc + '">' + c.label + '</label>' +
          '<input type="range" min="0" max="100" value="' + values[c.key] + '" data-key="' + c.key + '">' +
          '<span class="val" data-val="' + c.key + '">' + values[c.key] + '</span>';
        controlsEl.appendChild(row);
      });
      controlsEl.addEventListener("input", e => {
        const key = e.target.dataset.key;
        if (!key) return;
        values[key] = Number(e.target.value);
        render();
      });
      document.getElementById("reset").onclick = () => {
        const p = PRESETS.find(x => x.body === sel.body && x.lens === sel.lens) || PRESETS[0];
        values = { ...p.v };
        if (sel.film === "bw") values.saturation = 0;
        render();
      };

      /* ── 실제 기기 수치 변환 ── */
      function kelvinOf(warmth) { return Math.round((8000 - warmth * 50) / 50) * 50; }  // 0(차가움)=8000K → 100(따뜻함)=3000K
      const APERTURES = ["f/1.2", "f/1.4", "f/1.8", "f/2.8", "f/4", "f/5.6", "f/8"];
      function apertureOf(bokeh) { return APERTURES[Math.min(6, Math.floor((100 - bokeh) / 15))]; }
      function isoOf(grain) {
        if (grain < 10) return "ISO 100 (기본 감도, 노이즈 거의 없음)";
        const iso = Math.round((100 + grain * 31) / 100) * 100;
        return "ISO " + iso;
      }
      function contrastCurveOf(c) {
        const ev = ((c - 50) / 50).toFixed(1);  // -1.0 ~ +1.0
        return c < 30 ? "플랫 로우컨트라스트 커브 (약 " + ev + " EV)" : c < 65 ? "표준 톤커브 (" + ev + " EV)" : "하드 하이컨트라스트 커브 (약 +" + Math.abs(ev) + " EV)";
      }
      function sharpnessLevelOf(s) { return Math.round(s / 10) + "/10"; }

      /* ── 프롬프트 생성 ── */
      function words(v, low, mid, high) { return v < 30 ? low : v < 65 ? mid : high; }
      function nameOf(arr, id) { const x = arr.find(i => i.id === id); return x ? x.name : null; }

      function buildPrompt() {
        const body = nameOf(BODIES, sel.body);
        const lens = nameOf(LENSES, sel.lens);
        const film = nameOf(FILMS, sel.film);
        const bw = sel.film === "bw";
        const kelvin = kelvinOf(values.warmth);
        const lines = [];
        lines.push("다음 사진을" + (body && body !== "선택 안 함" ? " '" + body + "' 카메라의 색감으로," : "") + (lens ? " '" + lens + "' 렌즈 시점으로," : "") + " 아래 촬영 세팅처럼 보정해줘.");
        lines.push("");
        if (body && body !== "선택 안 함") lines.push("· 카메라 컬러 사이언스: " + (BODIES.find(i => i.id === sel.body).desc.split(":")[1] || "").trim());
        if (film && film !== "선택 안 함") lines.push("· 필름 시뮬레이션: " + film + " — " + (FILMS.find(i => i.id === sel.film).desc.split(".")[0]).trim());
        if (bw) lines.push("· 완전한 흑백 모노크롬으로 변환 (채도 0%)");
        lines.push("· 화이트밸런스: " + kelvin + "K — " + words(values.warmth, "차가운 쿨톤", "자연스러운 중립 톤", "따뜻한 웜톤") + " (3000K=매우 따뜻함, 8000K=매우 차가움)");
        lines.push("· 톤커브: " + contrastCurveOf(values.contrast) + " — " + words(values.contrast, "낮고 부드러운 명암", "자연스러운 명암", "강하고 크리스피한 명암"));
        if (!bw) lines.push("· 채도: " + Math.round(values.saturation * 1.3) + "% — " + words(values.saturation, "채도를 낮춘 뉴트럴한", "자연스러운", "생생하고 진한") + " (기준 100%)");
        lines.push("· 조리개: " + apertureOf(values.bokeh) + " — " + words(values.bokeh, "전체적으로 선명한 깊은 심도", "완만한 보케", "크리미한 얕은 심도의 강한 보케") + " (f/1.2=최대 흐림, f/8=전체 선명)");
        lines.push("· 필름 그레인: " + isoOf(values.grain) + (values.grain < 10 ? "" : " — " + words(values.grain, "아주 은은한", "은은한", "뚜렷한 복고") + " 그레인") + " (높을수록 필름 노이즈 질감)");
        lines.push("· 비네트: " + values.vignette + "/100" + (values.vignette < 10 ? " (없음)" : " — " + words(values.vignette, "아주 약한", "은은한", "강한") + " 가장자리 어둡침"));
        lines.push("· 선명도: 샤프닝 레벨 " + sharpnessLevelOf(values.sharpness) + " — " + words(values.sharpness, "부드럽게 퍼지는", "균형 잡힌", "고해상도 초고선명") + " 디테일");
        lines.push("");
        lines.push("· 종합 EXIF 요약: WB " + kelvin + "K · " + apertureOf(values.bokeh) + " · " + (values.grain < 10 ? "ISO 100" : "ISO " + Math.round((100 + values.grain * 31) / 100) * 100) + " · 샤프닝 " + sharpnessLevelOf(values.sharpness) + "/10");
        lines.push("");
        lines.push("구도, 피사체, 앵글은 그대로 유지하고 색감·심도·선명도만 위 수치에 맞게 조정해줘.");
        return lines.join("\n");
      }

      function render() {
        CONTROLS.forEach(c => {
          const input = controlsEl.querySelector('[data-key="' + c.key + '"]');
          const val = controlsEl.querySelector('[data-val="' + c.key + '"]');
          if (input) input.value = values[c.key];
          if (val) val.textContent = values[c.key];
        });
        promptEl.textContent = buildPrompt();
      }
      render();

      /* ── 복사 ── */
      const copyBtn = document.getElementById("copy");
      const toast = document.getElementById("toast");
      copyBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(buildPrompt());
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = buildPrompt();
          document.body.appendChild(ta);
          ta.select(); document.execCommand("copy"); ta.remove();
        }
        copyBtn.textContent = "✅ 복사됨!";
        copyBtn.classList.add("ok");
        toast.classList.add("show");
        setTimeout(() => { copyBtn.textContent = "📋 프롬프트 복사"; copyBtn.classList.remove("ok"); toast.classList.remove("show"); }, 1600);
      };
    </script>
  </body>
</html>
